services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - default
      - john-postgres_default
      - john-minio_default
    environment:
      DATABASE_URL: postgresql+psycopg://english-study:english-study-123@postgres:5432/english-study
      USE_MIGRATIONS: "true"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://john-minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: english-study-bucket
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      CORS_ORIGINS: https://es.cool-app.me,http://es.cool-app.me
      ENABLE_SCHEDULER: "true"
      SEED_ON_STARTUP: "true"
      JWT_SECRET: change-me-in-production
      DATA_DIR: /app/data
    volumes:
      - english_study_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  john-postgres_default:
    external: true
  john-minio_default:
    external: true

volumes:
  english_study_data:
