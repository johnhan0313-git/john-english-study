services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - default
      - john-postgresql_default
      - john-minio_default
    environment:
      DATABASE_URL: postgresql+psycopg://english-study:english-study-123@john-postgresql:5432/english-study
      USE_MIGRATIONS: "true"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://john-minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: english-study-bucket
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      CORS_ORIGINS: https://es.cool-app.me,http://es.cool-app.me
      ENABLE_SCHEDULER: "true"
      SEED_ON_STARTUP: "true"
      JWT_SECRET: change-me-in-production
      DATA_DIR: /app/data
      # 邮件验证码（Portainer Stack 环境变量中填入真实值，见 docs/PORTAINER_DEPLOY.md）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      EMAIL_CODE_EXPIRE_MINUTES: ${EMAIL_CODE_EXPIRE_MINUTES:-10}
      EMAIL_CODE_COOLDOWN_SECONDS: ${EMAIL_CODE_COOLDOWN_SECONDS:-60}
    volumes:
      - english_study_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  john-postgresql_default:
    external: true
  john-minio_default:
    external: true


volumes:
  english_study_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/john-han/mydocker/mntdata/english_study_data