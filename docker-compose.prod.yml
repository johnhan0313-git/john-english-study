services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    networks:
      - default
      - john-postgresql_default
      - john-minio_default
    environment:
      DATABASE_URL: postgresql+psycopg://english-study:english-study-123@john-postgresql:5432/english-study
      USE_MIGRATIONS: "true"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://john-minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: english-study-bucket
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      CORS_ORIGINS: https://se.cool-app.me,http://se.cool-app.me
      ENABLE_SCHEDULER: "true"
      SEED_ON_STARTUP: "true"
      JWT_SECRET: change-me-in-production
      DATA_DIR: /app/data
      # 邮件验证码（Portainer Stack 环境变量中填入真实值，见 docs/PORTAINER_DEPLOY.md）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      EMAIL_CODE_EXPIRE_MINUTES: ${EMAIL_CODE_EXPIRE_MINUTES:-10}
      EMAIL_CODE_COOLDOWN_SECONDS: ${EMAIL_CODE_COOLDOWN_SECONDS:-60}
      # LLM 场景生成（未配置 AI_LLM_API_KEY 时使用 Mock 固定内容）
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-https://api.openai.com/v1}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-gpt-4o-mini}
      # 口语转写（可选，未配置则口语评测不可用）
      AI_STT_BASE_URL: ${AI_STT_BASE_URL:-https://api.openai.com/v1}
      AI_STT_API_KEY: ${AI_STT_API_KEY:-}
      AI_STT_MODEL: ${AI_STT_MODEL:-whisper-1}
      # 听力 TTS（默认 Edge TTS 免费，无需 API Key）
      USE_EDGE_TTS: ${USE_EDGE_TTS:-true}
      AI_TTS_BASE_URL: ${AI_TTS_BASE_URL:-https://api.openai.com/v1}
      AI_TTS_API_KEY: ${AI_TTS_API_KEY:-}
      AI_TTS_MODEL: ${AI_TTS_MODEL:-tts-1}
      AI_TTS_VOICE: ${AI_TTS_VOICE:-alloy}
    volumes:
      - english_study_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  john-postgresql_default:
    external: true
  john-minio_default:
    external: true


volumes:
  english_study_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/john-han/mydocker/mntdata/english_study_data