name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @sceneenglish/api-client
      - run: npm run build -w @sceneenglish/app-core
      - run: bash ./scripts/check-frontend-architecture.sh

  web:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @sceneenglish/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api

  shell:
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build -w @sceneenglish/shell
        env:
          VITE_API_URL: https://se.cool-app.me/api

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-env.sh

  production-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.prod.example .env.prod
      - run: |
          sed -i 's|REPLACE_ME|ci-test-secret|g' .env.prod
          sed -i 's|REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS|ci-only-jwt-secret-at-least-32-characters|g' .env.prod
          mkdir -p /tmp/john-secrets
          printf 'ci-package-token' > /tmp/john-secrets/gh_packages_token
      - run: GH_PACKAGES_TOKEN_FILE=/tmp/john-secrets/gh_packages_token ./scripts/validate-deployment.sh .env.prod
